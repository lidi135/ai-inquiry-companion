[project]
name = "ai-inquiry-companion"
version = "1.0.0"
description = "大理大学医学生 AI 问诊陪练助手（虚拟标准化病人 + 智能评分）"
requires-python = ">=3.11"
# 依赖安装以 requirements*.txt 为准（见 src/requirements.txt 与 requirements-dev.txt）

# ---------------------------------------------------------------------------
# Ruff：代码风格与静态检查
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "records", "data"]

[tool.ruff.lint]
# E: pycodestyle 错误 / F: pyflakes / W: pycodestyle 告警 / I: import 排序
select = ["E", "F", "W", "I"]
# 行长度交给人工与格式器，不做硬性报错
ignore = ["E501"]

# ---------------------------------------------------------------------------
# mypy：渐进式类型检查（仅对已标注部分做检查）
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["records/", "data/"]

# ---------------------------------------------------------------------------
# coverage：测试覆盖率统计与报告
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/core", "src/eval"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]